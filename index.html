<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="authScreen" class="auth-screen">

        <div class="auth-box">

            <h1>Lantern Run</h1>

            <p id="authTitle">Sign in</p>

            <form id="authForm">

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Sign In</button>

            </form>

            <p id="authMessage"></p>

            <button id="switchAuthBtn" type="button">Create an account</button>
        </div>
    </div>
    
    <main>
        <h1>Lantern Run</h1>

        <div class="game-wrapper">
            <canvas id="game" width="960" height="540"></canvas>
        </div>

        <p class="controls">
            A / D or ← / → to move · Space to jump
        </p>
    </main>

    <script type="module" src="game.js"></script>
</body>
</html>
